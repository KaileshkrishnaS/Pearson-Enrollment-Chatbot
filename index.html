<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pearson Connections Academy – Pearchatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2fb;--card:#fff;--ink:#1d2340;--mute:#6b7396;--pri:#4f46e5;--pri2:#7c3aed;--bot:#fff;--usr:linear-gradient(135deg,#4f46e5,#7c3aed);--line:#e1e6f5;--ok:#10b981}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--card:#171b36;--ink:#e8ebff;--mute:#9aa3cf;--bot:#202649;--line:#2a3160}}
:root[data-theme="dark"]{--bg:#0f1226;--card:#171b36;--ink:#e8ebff;--mute:#9aa3cf;--bot:#202649;--line:#2a3160}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:520px;height:100%;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:820px;background:var(--card);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #4f46e540;border-radius:0}
@media(min-width:560px){.app{height:92%;border-radius:24px}}
header{padding:14px 18px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;background:#ffffff26;position:relative;flex:none}
.logo svg,.av svg{display:block;width:100%;height:100%;border-radius:50%}
.hd{animation:bob 3s ease-in-out infinite}.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}.mo{transform-box:fill-box;transform-origin:center;animation:talk 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.6px)}}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes talk{50%{transform:scaleY(1.4)}}
.logo:after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#34d399;border:2px solid #6d3fe0;animation:pulse 2s infinite}
header b{display:block;font-size:16px}header small{opacity:.85}
.bar{height:4px;background:#ffffff30}.bar i{display:block;height:100%;width:0;background:#fde68a;transition:width .6s ease}
#chat{flex:1;overflow-y:auto;padding:18px 14px 8px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.row{display:flex;gap:8px;align-items:flex-end;animation:pop .35s cubic-bezier(.2,1.3,.4,1) both}
.row.u{justify-content:flex-end}
.av{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 2px 8px #4f46e533}
.b{max-width:80%;padding:10px 14px;border-radius:18px;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px;word-wrap:break-word;white-space:pre-wrap}
.u .b{background:var(--usr);color:#fff;border:0;border-radius:18px;border-bottom-right-radius:4px}
.b img{display:block;max-width:100%;max-height:160px;border-radius:10px}
.typing{display:flex;gap:5px;padding:14px 16px}.typing i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:bounce 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
#dock{padding:12px 14px 14px;border-top:1px solid var(--line);background:var(--card);min-height:68px;position:relative;z-index:5}
.in{display:flex;gap:8px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;outline:0;flex:1;min-width:0;transition:border .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px #4f46e51f}
textarea{resize:none;height:84px;width:100%}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:11px 18px;background:var(--usr);color:#fff;font-weight:600;transition:transform .15s,box-shadow .2s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 18px #4f46e540}button:active{transform:scale(.96)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);color:var(--pri);border:1.5px solid var(--pri);box-shadow:none}
.chip:hover{background:var(--pri);color:#fff}
.drop{display:block;border:2px dashed var(--pri);border-radius:16px;padding:18px;text-align:center;color:var(--mute);cursor:pointer;transition:background .2s}
.drop:hover,.drop.on{background:#4f46e514}.drop b{color:var(--pri)}
.err{color:#e11d48;font-size:13px;margin-top:6px;animation:shake .4s}
.card{background:var(--bot);border:1px solid var(--line);border-radius:16px;padding:14px;max-width:88%;animation:pop .4s both}
.card h4{margin:0 0 8px}.card p{margin:4px 0;font-size:13.5px}.card span{color:var(--mute)}
.card button{margin-top:10px;width:100%}
.ok{width:54px;height:54px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 8px;animation:pop .6s both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
@keyframes pulse{50%{box-shadow:0 0 0 5px #34d39944}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body>
<div class="app">
  <header><div class="logo" id="logo"></div><div><b>Pearchatbot</b><small>Pearson Connections Academy · Enrollment</small></div></header>
  <div class="bar"><i id="prog"></i></div>
  <div id="chat"></div>
  <div id="dock"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s),chat=$('#chat'),dock=$('#dock');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const scroll=()=>setTimeout(()=>chat.scrollTop=chat.scrollHeight,30);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const A={};const QA=[];
const AV=`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="32" fill="#c7d2fe"/><path d="M8 64Q12 46 32 46Q52 46 56 64Z" fill="#4f46e5"/><path d="M25 47L32 57L39 47Z" fill="#fff"/><rect x="27" y="38" width="10" height="11" rx="3" fill="#e0a67c"/><g class="hd"><circle cx="19.5" cy="31" r="2.6" fill="#e8b088"/><circle cx="44.5" cy="31" r="2.6" fill="#e8b088"/><ellipse cx="32" cy="30" rx="12.5" ry="14" fill="#f4c59c"/><path d="M18.5 29Q16 11 32 12.5Q48 11 45.5 29Q43 20 32 20Q21 20 18.5 29Z" fill="#2b2b3a"/><path d="M23.5 26.5L29.5 26M34.5 26L40.5 26.5" stroke="#2b2b3a" stroke-width="1.5" stroke-linecap="round"/><ellipse class="eye" cx="27" cy="31" rx="1.9" ry="2.3" fill="#1d2340"/><ellipse class="eye" cx="37" cy="31" rx="1.9" ry="2.3" fill="#1d2340"/><circle cx="23.5" cy="36" r="2.4" fill="#f59e8b" opacity=".5"/><circle cx="40.5" cy="36" r="2.4" fill="#f59e8b" opacity=".5"/><path d="M32 32.5Q30.5 36 32.5 36.5" stroke="#c98a63" stroke-width="1.2" fill="none" stroke-linecap="round"/><path class="mo" d="M27 39.5Q32 44.5 37 39.5Q32 41 27 39.5Z" fill="#9b3d3d" stroke="#9b3d3d" stroke-width="1.2" stroke-linejoin="round"/></g></svg>`;
$('#logo').innerHTML=AV;

const idle=()=>{
  dock.onclick=null;
  dock.innerHTML=`<div class="in"><input id="t-idle" placeholder="Type here… 💬" autocomplete="off"><button id="go-idle" style="opacity:.5">Send ➤</button></div>`;
};

function row(html,u){
  const r=document.createElement('div');
  r.className='row'+(u?' u':'');
  r.innerHTML=(u?'':'<div class="av">'+AV+'</div>')+html;
  chat.appendChild(r);
  scroll();
  return r;
}

async function bot(t){
  const r=row('<div class="b typing"><i></i><i></i><i></i></div>');
  await sleep(550+Math.min(t.length*14,900));
  r.querySelector('.b').outerHTML='<div class="b">'+esc(t)+'</div>';
  scroll();
}

const me=h=>row('<div class="b">'+h+'</div>',true);
const prog=n=>$('#prog').style.width=n+'%';

function ask(kind,o={}){
  return new Promise(res=>{
    const done=(val,html)=>{
      dock.onclick=null;
      me(html??esc(val));
      res(val);
    };

    if(kind==='chips'){
      dock.innerHTML='<div class="chips">'+o.opts.map((x,i)=>`<button class="chip" data-i="${i}">${x}</button>`).join('')+'</div>';
      dock.onclick=e=>{
        const b=e.target.closest('.chip');
        if(b) done(o.opts[b.dataset.i]);
      };
      return;
    }

    if(kind==='text'){
      dock.innerHTML=`<div class="in"><input id="t" placeholder="${o.ph||'Type here…'}" autocomplete="off"><button id="go">Send ➤</button></div><div id="e"></div>`;
      const t=$('#t'), go=()=>{
        const v=t.value.trim();
        if(!v){ $('#e').innerHTML='<div class="err">Please type something 🙂</div>'; return; }
        if(o.check){
          const m=o.check(v);
          if(m){ $('#e').innerHTML='<div class="err">'+m+'</div>'; return; }
        }
        done(v);
      };
      $('#go').onclick=go;
      t.onkeydown=e=>{ if(e.key==='Enter') go(); };
      setTimeout(()=>{ t.focus(); }, 100);
      return;
    }

    if(kind==='date'){
      const today=new Date().toISOString().slice(0,10);
      dock.innerHTML=`<div class="in"><input id="d" type="date" min="1990-01-01" max="${today}"><button id="go">Select 📅</button></div><div id="e"></div>`;
      const d=$('#d');
      $('#go').onclick=()=>{
        if(!d.value){ $('#e').innerHTML='<div class="err">Pick a date from the calendar 📅</div>'; return; }
        const dt=new Date(d.value+'T00:00');
        const f=dt.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
        done(f,'📅 '+f);
      };
      setTimeout(()=>{ d.focus(); }, 100);
      return;
    }

    if(kind==='file'){
      dock.innerHTML=`<label class="drop" id="dz">📎 <b>Tap to upload</b> or drop the proof of age here<br><small>Birth certificate / ID — JPG or PNG image</small><input id="f" type="file" accept="image/*" hidden></label><div id="e"></div>`;
      const f=$('#f'), dz=$('#dz');
      const take=file=>{
        if(!file||!file.type.startsWith('image/')){
          $('#e').innerHTML='<div class="err">Please upload an image file (JPG / PNG) 🖼️</div>';
          return;
        }
        const rd=new FileReader();
        rd.onload=()=>{
          const im=new Image();
          im.onload=()=>{
            const m=1400, s=Math.min(1,m/Math.max(im.width,im.height)), c=document.createElement('canvas');
            c.width=im.width*s; c.height=im.height*s;
            const x=c.getContext('2d');
            x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
            x.drawImage(im,0,0,c.width,c.height);
            
            const cleanStuName = (A.stu || 'student').toLowerCase().replace(/[^a-z0-9]/g, '_');
            const fileExt = file.name.split('.').pop() || 'jpg';
            const formattedFileName = `proofofage_${cleanStuName}_${Date.now()}.${fileExt}`;

            A.doc={data:c.toDataURL('image/jpeg',.85),w:c.width,h:c.height,name:formattedFileName};
            done(formattedFileName,`<img src="${rd.result}"><div style="margin-top:6px;font-size:13px">${esc(formattedFileName)}</div>`);
          };
          im.src=rd.result;
        };
        rd.readAsDataURL(file);
      };
      f.onchange=()=>take(f.files[0]);
      dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};
      dz.ondragleave=()=>dz.classList.remove('on');
      dz.ondrop=e=>{e.preventDefault();take(e.dataTransfer.files[0])};
      return;
    }

    if(kind==='area'){
      dock.innerHTML=`<textarea id="q" placeholder="Type your question, or leave blank if none…"></textarea><button id="go" style="width:100%;margin-top:8px">Submit ✅</button>`;
      const ta=$('#q');
      $('#go').onclick=()=>{
        const v=ta.value.trim();
        done(v||'No other queries', v?esc(v):'No other queries 👍');
      };
      setTimeout(()=>{ ta.focus(); }, 100);
      return;
    }
  });
}

const rec=(q,a)=>{QA.push([q,a]);return a};

async function flow(){
  await sleep(400);
  await bot('Welcome to Pearson Connections Academy! 🎓✨\nI am your Pearchatbot 👨‍💼');
  await bot('What is your name?');
  A.name=rec('What is your name?',await ask('text',{ph:'Your name',check:v=>v.length<2?'Name looks too short':''}));
  prog(10);

  await bot(`Hi ${A.name}! 👋😊 Good to meet you!`);
  await bot('Can we enroll by chatting? 💬 (Y/N)');
  const y=rec('Can we enroll by chatting (Y/N)?',await ask('chips',{opts:['Y – Yes! 🎉','N – No 🙅']}));
  if(y[0]==='N'){
    await bot('No worries! 😊 Come back anytime you’d like to enroll via chat. See you soon, '+A.name+'! 👋');
    dock.innerHTML='<button onclick="location.reload()" style="width:100%">Start again 🔄</button>';
    return;
  }
  prog(20);

  await bot('Wonderful! Let’s begin 🚀\nWhat is your student’s name?');
  A.stu=rec('What is your student\'s name?',await ask('text',{ph:'Student name'}));
  prog(30);

  await bot(`Enrolling ${A.stu} for grade?`);
  A.grade=rec(`Enrolling ${A.stu} for grade?`,await ask('text',{ph:'e.g. 3, 5, etc.', check:v=>isNaN(v)?'Please enter a valid grade number':''}));
  prog(40);

  // Age input loop with conditional "Too Young" / "Too Old" messaging
  let validAge = false;
  while (!validAge) {
    await bot(`What is ${A.stu}'s age?`);
    const ag=await ask('text',{ph:'Age in years, e.g. 8', check:v=>isNaN(v)?'Please enter a valid number':''});
    const numericAge = parseInt(ag, 10);
    const numericGrade = parseInt(A.grade, 10);
    const diff = numericAge - numericGrade;

    if (diff >= 5 && diff <= 7) {
      A.age = ag;
      rec('What is your student\'s age?', ag+' years');
      validAge = true;
    } else {
      const statusText = diff < 5 ? 'Too Young' : 'Too Old';
      await bot(`Are you sure about ${A.stu}'s age (${statusText})? (Y/N)`);
      const confirmChoice = await ask('chips',{opts:['Y – Yes ✅','N – No ❌']});
      if (confirmChoice[0] === 'Y') {
        A.age = ag;
        rec('What is your student\'s age?', ag+' years (' + statusText + ' confirmed)');
        validAge = true;
      } else {
        await bot('Let us re-enter the age details.');
      }
    }
  }
  prog(55);

  const yr=new Date().getFullYear();
  await bot('Great! 📚 Student enrollment for the academic year?');
  A.year=rec('Student enrollment for the academic year?',await ask('chips',{opts:[0,1,2].map(i=>`${yr+i}-${String(yr+i+1).slice(2)}`)}));
  prog(70);

  await bot('Perfect choice! 🏫 Interested School name?');
  A.school=rec('Interested School name?',await ask('text',{ph:'School name'}));
  prog(80);

  await bot('Almost there! 📄 Please submit the proof of age document.');
  await ask('file');
  QA.push(['Proof of age document',A.doc.name+' (attached below)']);
  prog(90);

  await bot('Got it, thank you! ✅\nAny other queries?');
  A.q=rec('Any other queries?',await ask('area'));
  prog(100);

  await bot('🎉 Thank you '+A.name+'! Preparing your application summary…');
  await sleep(500);

  const ref='PVS-'+Date.now().toString(36).toUpperCase().slice(-6);
  A.ref=ref;
  const blob=buildPDF(ref);
  const c=row(`<div class="card"><div class="ok">✓</div><h4>Enrollment Application Summary</h4><p><span>Reference:</span> <b>${ref}</b></p><p><span>Student:</span> ${esc(A.stu)}</p><p><span>Grade:</span> ${esc(A.grade)}</p><p><span>School:</span> ${esc(A.school)}</p><p><span>Year:</span> ${esc(A.year)}</p><p style="margin-top:8px">Please download and verify the details in the PDF.</p><button id="dl">⬇ Download PDF</button></div>`);
  $('#dl').onclick=()=>save(blob,`Pearson-Enrollment-${ref}.pdf`);
  dock.innerHTML='<div style="text-align:center;color:var(--mute)">Chat completed 🎓 · <a href="#" onclick="location.reload();return false" style="color:var(--pri)">Start a new enrollment</a></div>';
  await bot('Our enrollment team will contact you shortly. Have a great day! 🌟');
}

function buildPDF(ref){
  const {jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),W=210,M=16;
  d.setFillColor(79,70,229);d.rect(0,0,W,30,'F');d.setTextColor(255);d.setFont('helvetica','bold');d.setFontSize(20);d.text('Pearson Connections Academy',M,14);
  d.setFontSize(11);d.setFont('helvetica','normal');d.text('Enrollment Application Summary',M,22);d.text('Ref: '+ref,W-M,14,{align:'right'});
  d.text(new Date().toLocaleString(),W-M,22,{align:'right'});
  let y=42;d.setTextColor(30,35,64);
  QA.forEach(([q,a],i)=>{
    d.setFont('helvetica','bold');d.setFontSize(10.5);d.setTextColor(79,70,229);d.text(`Q${i+1}. ${q}`,M,y);y+=6;
    d.setFont('helvetica','normal');d.setFontSize(11.5);d.setTextColor(30,35,64);
    const L=d.splitTextToSize('A: '+String(a).replace(/[^\x20-\x7E\n]/g,''),W-2*M);d.text(L,M+2,y);y+=L.length*5.5+3;
    d.setDrawColor(225,230,245);d.line(M,y-2,W-M,y-2);y+=4;
    if(y>270){d.addPage();y=20}
  });
  const doc=A.doc;if(doc){let mw=W-2*M,mh=297-y-40;if(mh<60){d.addPage();y=20;mh=297-y-40}
    d.setFont('helvetica','bold');d.setFontSize(10.5);d.setTextColor(79,70,229);d.text('Proof of age document (for verification)',M,y);y+=4;
    const s=Math.min(mw/doc.w,mh/doc.h),w=doc.w*s,h=doc.h*s;d.setDrawColor(79,70,229);d.rect(M-1,y-1,w+2,h+2);d.addImage(doc.data,'JPEG',M,y,w,h);y+=h+8}
  d.setFontSize(9);d.setTextColor(120);d.text('Please verify all details above. Generated by Pearchatbot - Pearson Connections Academy.',M,288);
  return d.output('blob');
}

async function save(blob,name){
  try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}

window.addEventListener('DOMContentLoaded', () => {
  flow();
});
</script>
</body>
</html>
